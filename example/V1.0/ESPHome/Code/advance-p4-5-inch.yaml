esphome:
  name: advance-p4-5-inch
  friendly_name: Advance-P4-5-inch
  on_boot:
    priority: 600.0
    then:
      - lambda: |-
          uint8_t cmd[2] = {0x20, 100};
          id(bus_a).write(0x2F, cmd, 2);  

esp32:
  variant: esp32p4
  engineering_sample: true  
  cpu_frequency: 360MHZ
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      execute_from_psram: true
      enable_idf_experimental_features: true

psram:
  speed: 200MHz

# Enable logging
logger:
  level: debug
  logs:
    lvgl: info
  hardware_uart: UART0

# Enable Home Assistant API
api:
  encryption:
    key: "d4yhS7jMb1+LEJ8wpz2KLSMJR73evpUJazYyY1ab6EU="

ota:
  - platform: esphome
    password: "7e67f5f46de710476467d7daed31b484"

esp32_hosted:
  variant: esp32c6
  active_high: true
  reset_pin: GPIO32
  cmd_pin: GPIO54
  clk_pin: GPIO53
  d0_pin: GPIO52
  d1_pin: GPIO51
  d2_pin: GPIO50
  d3_pin: GPIO49
  
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Advance-P4-5-Inch"
    password: "1zSU4rOJQyzw"

captive_portal:
    
i2c:
  - id: bus_a
    sda: GPIO45
    scl: GPIO46
    frequency: 400kHz

touchscreen:
  - platform: gt911
    id: my_touchscreen
    i2c_id: bus_a
    reset_pin: 36
    interrupt_pin: 42
    update_interval: 50ms
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false
    on_touch:
      - logger.log:
          format: "Touch at (%d, %d)"
          args: [touch.x, touch.y]
      - lambda: |-
          ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%d",
          touch.x,
          touch.y,
          touch.x_raw,
          touch.y_raw
          );

sensor:
  - platform: aht10
    variant: AHT20
    temperature:
      name: "Room Temperature"
      id: room_temp
      unit_of_measurement: "°C"
      accuracy_decimals: 1
    humidity:
      name: "Room Humidity"
      id: room_hum
      unit_of_measurement: "%"
      accuracy_decimals: 1
    update_interval: 1s

switch:
  - platform: gpio
    pin: GPIO48
    name: "LED"
    id: led_output
    on_turn_on:
      - lvgl.image.update:
          id: lvgl_light
          src: light_on
      - lvgl.label.update:
          id: label_light_state
          text: "ON"
    on_turn_off:
      - lvgl.image.update:
          id: lvgl_light
          src: light_off
      - lvgl.label.update:
          id: label_light_state
          text: "OFF"
          
  - platform: template
    name: "Backlight Power"
    id: backlight_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    internal: true
    turn_on_action:
      - lambda: |-
          uint8_t cmd[2] = { 0x20, 100 };
          id(bus_a).write(0x2F, cmd, 2);
    turn_off_action:
      - lambda: |-
          uint8_t cmd[2] = { 0x20, 0 };
          id(bus_a).write(0x2F, cmd, 2);    
          
spi:
  - id: spi_bus
    clk_pin: GPIO26 
    mosi_pin: GPIO47 

display:
  - platform: mipi_rgb
    model: custom
    id: rpi_disp
    update_interval: never
    auto_clear_enabled: false
    color_order: RGB
    pclk_frequency: 16MHz
    dimensions:
      width: 800
      height: 480
    de_pin:
      number: 2
    hsync_pin:
      number: 40
    vsync_pin:
      number: 41
    pclk_pin: 3
    pclk_inverted: true
    hsync_back_porch: 4
    hsync_front_porch: 8
    hsync_pulse_width: 8
    vsync_back_porch: 4
    vsync_front_porch: 8
    vsync_pulse_width: 8
    data_pins:
      red:
        - 19         #r3
        - 18         #r4
        - 17        #r5
        - 16        #r6
        - 15        #r7
      blue:
        - 8        #b3
        - 7        #b4
        - 6        #b5
        - 5        #b6
        - 4        #b7
      green:
        - 14        #g2
        - 13         #g3
        - 12        #g4
        - 11        #g5
        - 10        #g6
        - 9        #g7

    init_sequence:
      - [0x01]
      - [0x3A, 0x66]

image:
  - file: "small_temp.png"
    id: small_temp
    resize: 200x200
    type: RGB565
  - file: "small_hum.png"
    id: small_hum
    resize: 200x200
    type: RGB565
  - file: "small_logo.png"
    id: small_logo
    resize: 200x100
    type: RGB565
  - file: "light.png"
    id: light_on
    resize: 200x200
    type: RGB565
    transparency: alpha_channel
  - file: "no_light.png"
    id: light_off
    resize: 200x200
    type: RGB565
    transparency: alpha_channel

lvgl:
  buffer_size: 50%
  color_depth: 16
  log_level: INFO
  bg_color: 0xFFFFFF
  text_font: montserrat_26
  widgets:  
    - image:
        id: lvgl_logo
        src: small_logo
        x: 300
        y: 20
    - image:
        id: lvgl_temp
        src: small_temp
        x: 150
        y: 250
    - image:
        id: lvgl_hum
        src: small_hum
        x: 400
        y: 250
    - image:
        id: lvgl_light
        src: light_off    
        x: 650            
        y: 250
    - label:
        id: label_temp
        x: 90
        y: 350
        text: "Temp: --°C"
    - label:
        id: label_hum
        x: 350
        y: 350
        text: "Humi: --%"
    - label:
        id: label_light_state
        x: 650
        y: 350
        text: "OFF"

interval:
  - interval: 1s
    then:
      - lambda: |-
          char temp_str[20];
          char hum_str[20];
          snprintf(temp_str, sizeof(temp_str), "Temp: %.1f°C", id(room_temp).state);
          snprintf(hum_str, sizeof(hum_str), "Humi: %.1f%%", id(room_hum).state);
          lv_label_set_text(id(label_temp), temp_str);
          lv_label_set_text(id(label_hum), hum_str);    